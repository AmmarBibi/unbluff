name: selftest

on:
  push:
    branches: [ main ]
  pull_request:

# CI-SHALLOW, 2026-08-06. `actions/checkout@v4` defaults to fetch-depth: 1, and this repo runs
# gates that ASK ABOUT THE PAST - tools/no_regression.py compares each unit against the newest
# committed blob that differs from the working tree. In a one-commit checkout that blob is
# unreachable, and the gate reported the absence of evidence as a finding: 11 of 11 jobs went
# red on a commit that was green locally, with a message asserting the unit "has no
# predecessor" - a statement about the repository that was simply false.
#
# no_regression now distinguishes "I could not look" from "there is nothing to look at" and
# reports the former as UNDETERMINED rather than blocking. That fix alone would have turned CI
# green by making the gate verify NOTHING here, every run, silently - which is the failure this
# repo exists to catch, not a fix for it. So the checkout fetches history and the gate does
# real work in CI; the UNDETERMINED state is the honest fallback for a tree we do not control,
# never the normal operating mode.
jobs:
  selftest:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']
        include:
          # The README advertises a 3.8 floor for EVERY platform, but 3.8 ran on Linux only,
          # so a construct that parses everywhere and misbehaves on 3.8 + Windows would ship
          # green. Windows is where path, encoding and process semantics differ most, which is
          # exactly where a floor claim is worth actually checking.
          - os: ubuntu-latest
            python-version: '3.8'   # verify the documented floor
          - os: windows-latest
            python-version: '3.8'
          # macOS is deliberately absent: setup-python ships no 3.8 build for the arm64
          # macos-latest runners. Recorded so its absence reads as a decision, not a gap.
    steps:
      # fetch-depth: 0 - see the CI-SHALLOW note under `jobs:`. Uniform across all four jobs
      # on purpose: "which job runs a history-dependent gate" is exactly the kind of roster
      # that rots, and a per-job answer would be wrong the first time a gate moves.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run hook selftests
        run: python run_selftests.py

  mutations:
    # The harness that proves the regression tests actually BITE was invoked by no automation
    # at all - it ran only when someone remembered. A decorative test could therefore reappear
    # between manual runs, which is the one failure this repo exists to prevent. Runs on
    # ubuntu so that the posix-only mutation (#30, the install() chmod) executes for the FIRST
    # time anywhere; on Windows it can only ever report SKIPPED.
    # CI=true also makes an UNPROVEN mutation (a verifying selftest that could not run) fail.
    name: mutation harness (do the tests bite?)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - see the CI-SHALLOW note under `jobs:`. Uniform across all four jobs
      # on purpose: "which job runs a history-dependent gate" is exactly the kind of roster
      # that rots, and a per-job answer would be wrong the first time a gate moves.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revert each fix and require the suite to go red
        run: python tools/mutation_check.py

  mutations-windows:
    # The MIRROR of the job above, and it exists for the same reason that one does. Some
    # mutations can only be meaningful on Windows - the job-object cleanup (#D10b) is a literal
    # no-op on POSIX - so an ubuntu-only mutation job proves them NOWHERE while printing a
    # clean summary. That is the exact shape of failure this repo is about, reproduced in the
    # harness that exists to detect it (P13 F).
    name: mutation harness (windows-only mutations)
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 - see the CI-SHALLOW note under `jobs:`. Uniform across all four jobs
      # on purpose: "which job runs a history-dependent gate" is exactly the kind of roster
      # that rots, and a per-job answer would be wrong the first time a gate moves.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revert each fix and require the suite to go red
        run: python tools/mutation_check.py

  selftest-with-pytest:
    # [RICH-CI] The INVERSE of the gap everyone looks for, and it was live for the whole life
    # of this suite. No workflow here pip-installs anything, so EVERY runner is permanently
    # WITHOUT pytest - which is why two probes shipped decorative and were caught here
    # (FTB-1/FTB-6, run 31526789857). The mirror of that is easy to miss: the code paths that
    # REQUIRE pytest are therefore exercised on NO runner at all, only on a maintainer's box.
    #
    # MEASURED on run 31595884191: `fast-test detection: ... 2 end-to-end case(s) run
    # (rust-decline, synthetic-rc5-wiring)`, with `SELFTEST SKIP: pytest not importable` twice.
    # The two skipped are `rc4-broken-conftest-BLOCKS` - the regression test for the CRITICAL
    # FTB-RC4 defect, where a broken conftest.py silently turned a caught regression green -
    # and `genuine-failure-still-blocks`, the control proving the gate still bites at all.
    # The suite's own denominator reported it honestly every run; nobody read it.
    #
    # One cheap job fixes that. It is deliberately NOT added to the OS matrix: the question is
    # "does the rich path work", not "does it work on three platforms", and a matrix here would
    # cost 3x to answer the same question once.
    name: selftest WITH pytest installed (the rich path CI never had)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - see the CI-SHALLOW note under `jobs:`. Uniform across all jobs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest (the ONLY job here that installs anything)
        run: python -m pip install --disable-pip-version-check pytest
      - name: Prove pytest really is importable, or this job is a no-op wearing a green tick
        run: python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('pytest') else 1)"
      - name: Run hook selftests with the rich path available
        run: python run_selftests.py
      - name: Require the pytest-dependent cases to have ACTUALLY RUN, not skipped
        # Without this the job would pass by skipping exactly what it exists to cover - the
        # same "a skip is not a pass" rule the hooks themselves are built on.
        run: |
          python run_selftests.py > out.txt 2>&1
          grep -q "4 end-to-end case(s) run" out.txt || {
            echo "The pytest-dependent end-to-end cases did NOT run in the job that exists to run them:";
            grep -o "fast-test detection:.*" out.txt; exit 1; }
          ! grep -q "SELFTEST SKIP: pytest not importable" out.txt || {
            echo "pytest reported not importable in the job that installs it:";
            grep "SELFTEST SKIP: pytest not importable" out.txt; exit 1; }

  integration:
    # This job had NEVER run outside ubuntu, while `selftest` above carried a 3-OS matrix all
    # along - so "install -> fire -> uninstall" was proven on ONE platform while CHANGELOG 1.1.1
    # asserted three. Of the four jobs here this is the one that most needed the matrix:
    # install.py writes command strings into settings.json, copytrees skill directories and
    # removes them again, which is exactly the behaviour that differs across path semantics,
    # filesystems and process spawning. One platform was the wrong denominator for it above all.
    #
    # fail-fast: false, as in `selftest` - a red on one OS must not cancel the other two and
    # leave their result unknown. An unknown is not a pass, and this repo exists to keep those
    # two things distinguishable.
    name: integration ${{ matrix.os }} (install -> fire -> uninstall)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # fetch-depth: 0 - see the CI-SHALLOW note under `jobs:`. Uniform across all four jobs
      # on purpose: "which job runs a history-dependent gate" is exactly the kind of roster
      # that rots, and a per-job answer would be wrong the first time a gate moves.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: End-to-end integration test
        run: python tests/test_integration.py
